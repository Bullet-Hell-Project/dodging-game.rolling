<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodging Game</title>
<meta name="description" content="A tiny browser bullet-hell. Dodge white bullets, chip down the green boss, survive.">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAHElEQVQ4jWNgGAWjYBSMglEwCkbBKBgFo2AUAAAHkgABivPFdgAAAABJRU5ErkJggg==">
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    color: #fff;
  }
  canvas { display: block; background: #000; cursor: default; }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 800px;
    padding: 8px 4px;
    color: #fff;
    font-family: monospace;
    font-size: 16px;
  }
  button {
    background: #fff;
    color: #000;
    border: none;
    padding: 4px 14px;
    font-family: monospace;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #ccc; }

  /* ============ MENU OVERLAY ============ */
  #menu {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 24px;
    overflow-y: auto;
  }
  #menu.hidden { display: none; }
  .menu-title {
    font-size: 36px;
    letter-spacing: 4px;
    margin-bottom: 4px;
    color: #f00;
    text-shadow: 0 0 12px #f00;
  }
  .menu-sub {
    color: #888;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 32px;
  }
  .menu-panel {
    border: 2px solid #333;
    padding: 24px 32px;
    background: #0a0a0a;
    min-width: 420px;
    max-width: 520px;
  }
  .opt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
  }
  .opt-label {
    font-size: 14px;
    letter-spacing: 1px;
    color: #ddd;
    flex: 1;
  }
  .opt-label small {
    display: block;
    color: #666;
    font-size: 11px;
    margin-top: 3px;
    letter-spacing: 0;
  }
  .opt-input {
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 6px 10px;
    font-family: monospace;
    font-size: 16px;
    width: 90px;
    text-align: center;
  }
  .opt-input:focus {
    outline: none;
    border-color: #f00;
  }
  /* Slider for speed */
  .speed-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 20px;
  }
  .speed-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .speed-value {
    color: #f00;
    font-size: 16px;
    font-weight: bold;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: #333;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    background: #fff;
    border: none;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    background: #fff;
    border: none;
    cursor: pointer;
    border-radius: 0;
  }
  /* Toggle switch */
  .toggle {
    position: relative;
    width: 54px;
    height: 26px;
    background: #333;
    border: 2px solid #666;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .toggle.on {
    background: #f00;
    border-color: #f00;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    background: #fff;
    transition: left 0.15s;
  }
  .toggle.on::after {
    left: 30px;
  }
  .menu-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }
  .menu-btn {
    flex: 1;
    padding: 10px 16px;
    font-size: 15px;
    letter-spacing: 2px;
    border: 2px solid #fff;
    background: #fff;
    color: #000;
    cursor: pointer;
    font-family: monospace;
    font-weight: bold;
  }
  .menu-btn:hover { background: #ccc; border-color: #ccc; }
  .menu-btn.primary {
    background: #f00;
    border-color: #f00;
    color: #fff;
  }
  .menu-btn.primary:hover {
    background: #c00;
    border-color: #c00;
  }
  .preset-row {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .preset-btn {
    flex: 1;
    padding: 5px 4px;
    font-size: 11px;
    letter-spacing: 1px;
    background: #000;
    color: #fff;
    border: 1px solid #444;
    cursor: pointer;
    font-family: monospace;
  }
  .preset-btn:hover {
    border-color: #fff;
  }
</style>
</head>
<body>

<!-- ============ PRE-STARTUP MENU ============ -->
<div id="menu">
  <div class="menu-title">DODGING GAME</div>
  <div class="menu-sub">a tiny browser bullet-hell</div>

  <div class="menu-panel">
    <div class="preset-row">
      <button class="preset-btn" data-preset="easy">EASY</button>
      <button class="preset-btn" data-preset="normal">NORMAL</button>
      <button class="preset-btn" data-preset="hard">HARD</button>
      <button class="preset-btn" data-preset="custom">CUSTOM</button>
    </div>

    <div class="opt-row">
      <label class="opt-label" for="playerHpInput">
        PLAYER HP
        <small>how much damage you can take</small>
      </label>
      <input id="playerHpInput" class="opt-input" type="number" min="5" max="999" step="5" value="80">
    </div>

    <div class="opt-row">
      <label class="opt-label" for="bossHpInput">
        BOSS HP
        <small>chip it down with FIGHT buttons</small>
      </label>
      <input id="bossHpInput" class="opt-input" type="number" min="8" max="9999" step="8" value="160">
    </div>

    <div class="speed-row">
      <div class="speed-header">
        <label class="opt-label" for="playerSpeedInput" style="margin:0;">
          PLAYER SPEED
          <small>default 6 · max 255 (ludicrous)</small>
        </label>
        <span class="speed-value" id="speedValue">6</span>
      </div>
      <input id="playerSpeedInput" type="range" min="6" max="255" step="1" value="6">
    </div>

    <div class="opt-row">
      <label class="opt-label">
        ATTACK_PER_HP MODE
        <small>lower HP → more attacks per second (harder)</small>
      </label>
      <div id="apHpToggle" class="toggle"></div>
    </div>

    <div class="menu-actions">
      <button id="startBtn" class="menu-btn primary">START</button>
      <button id="menuResetBtn" class="menu-btn">RESET</button>
    </div>
  </div>
</div>

<!-- ============ GAME ============ -->
<div class="hud">
  <span id="hpText">HP: 80 / 80</span>
  <span id="bossText">BOSS: 160 / 160</span>
  <span id="warningText">SAFE</span>
  <button id="resetBtn">RESTART</button>
</div>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTextSpan = document.getElementById('hpText');
    const bossTextSpan = document.getElementById('bossText');
    const warningTextSpan = document.getElementById('warningText');

    // ============ OPTIONS ============
    const DEFAULTS = {
      playerHp: 80,
      bossHp: 160,
      playerSpeed: 6,
      attackPerHp: false
    };

    const options = { ...DEFAULTS };

    const PRESETS = {
      easy:   { playerHp: 120, bossHp: 120, playerSpeed: 7, attackPerHp: false },
      normal: { playerHp: 80,  bossHp: 160, playerSpeed: 6, attackPerHp: false },
      hard:   { playerHp: 60,  bossHp: 240, playerSpeed: 5, attackPerHp: true  }
    };

    // Menu DOM
    const menu = document.getElementById('menu');
    const playerHpInput = document.getElementById('playerHpInput');
    const bossHpInput = document.getElementById('bossHpInput');
    const playerSpeedInput = document.getElementById('playerSpeedInput');
    const speedValue = document.getElementById('speedValue');
    const apHpToggle = document.getElementById('apHpToggle');
    const startBtn = document.getElementById('startBtn');
    const menuResetBtn = document.getElementById('menuResetBtn');

    function syncMenuFromOptions() {
      playerHpInput.value = options.playerHp;
      bossHpInput.value = options.bossHp;
      playerSpeedInput.value = options.playerSpeed;
      speedValue.textContent = options.playerSpeed;
      apHpToggle.classList.toggle('on', options.attackPerHp);
    }

    function readOptionsFromMenu() {
      let pHp = parseInt(playerHpInput.value, 10);
      let bHp = parseInt(bossHpInput.value, 10);
      let spd = parseInt(playerSpeedInput.value, 10);
      if (!Number.isFinite(pHp) || pHp < 5) pHp = 5;
      if (pHp > 999) pHp = 999;
      if (!Number.isFinite(bHp) || bHp < 8) bHp = 8;
      if (bHp > 9999) bHp = 9999;
      if (!Number.isFinite(spd) || spd < 6) spd = 6;
      if (spd > 255) spd = 255;
      options.playerHp = pHp;
      options.bossHp = bHp;
      options.playerSpeed = spd;
      options.attackPerHp = apHpToggle.classList.contains('on');
    }

    // Speed slider live update
    playerSpeedInput.addEventListener('input', () => {
      speedValue.textContent = playerSpeedInput.value;
    });

    // Toggle
    apHpToggle.addEventListener('click', () => {
      apHpToggle.classList.toggle('on');
    });

    // Presets
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.preset;
        if (name === 'custom') return;
        const p = PRESETS[name];
        options.playerHp = p.playerHp;
        options.bossHp = p.bossHp;
        options.playerSpeed = p.playerSpeed;
        options.attackPerHp = p.attackPerHp;
        syncMenuFromOptions();
      });
    });

    // Menu reset
    menuResetBtn.addEventListener('click', () => {
      Object.assign(options, DEFAULTS);
      syncMenuFromOptions();
    });

    // Start
    startBtn.addEventListener('click', () => {
      readOptionsFromMenu();
      menu.classList.add('hidden');
      startGame();
    });

    // ============ GAME CONSTANTS ============
    const PLAYER_SIZE = 12;
    const DAMAGE = 5;
    const INVINCIBLE_TIME = 0.9;

    const W = canvas.width;
    const H = canvas.height;

    const BOSS_SIZE = 60;
    const FIGHT_DAMAGE = 8;

    const FIGHT_W = 80;
    const FIGHT_H = 30;
    const FIGHT_LIFETIME = 4.0;
    const FIGHT_SPAWN_MIN = 3.5;
    const FIGHT_SPAWN_MAX = 5.5;
    const FIGHT_SPAWN_LOWHP_MULT = 0.3;

    const HIT_FLASH_TIME = 0.3;
    const SLASH_TIME = 0.22;
    const SHAKE_TIME = 0.28;
    const SHAKE_AMP = 6;

    const APHP_COOLDOWN_MIN_MULT = 0.45;

    // ============ GAME STATE ============
    let player = {
      x: W / 2,
      y: H / 2,
      size: PLAYER_SIZE,
      hp: options.playerHp,
      maxHp: options.playerHp,
      speed: options.playerSpeed,
      invincible: false,
      invincibleTimer: 0,
      visible: true,
      blinkAccum: 0
    };

    let boss = {
      x: W - 90,
      y: 90,
      size: BOSS_SIZE,
      hp: options.bossHp,
      maxHp: options.bossHp,
      hitFlash: 0,
      slashTimer: 0,
      slashAngle: 0,
      shakeTimer: 0,
      shakeOffset: { x: 0, y: 0 }
    };

    let bullets = [];
    let warning = null;
    let pendingPattern = null;

    let phase = 'idle';
    let phaseTimer = 1.5;
    let totalTime = 0;

    let fightButton = null;
    let fightSpawnTimer = 2.5;

    let damageTexts = [];

    let keys = {};
    let gameOver = false;
    let won = false;
    let lastTimestamp = 0;
    let running = false;

    function updateHud() {
      hpTextSpan.textContent = `HP: ${Math.max(0, player.hp)} / ${player.maxHp}`;
      bossTextSpan.textContent = `BOSS: ${Math.max(0, boss.hp)} / ${boss.maxHp}`;
    }

    function resetState() {
      gameOver = false;
      won = false;

      player.x = W / 2;
      player.y = H / 2;
      player.hp = options.playerHp;
      player.maxHp = options.playerHp;
      player.speed = options.playerSpeed;
      player.invincible = false;
      player.invincibleTimer = 0;
      player.visible = true;
      player.blinkAccum = 0;

      boss.hp = options.bossHp;
      boss.maxHp = options.bossHp;
      boss.hitFlash = 0;
      boss.slashTimer = 0;
      boss.slashAngle = 0;
      boss.shakeTimer = 0;
      boss.shakeOffset = { x: 0, y: 0 };

      bullets = [];
      warning = null;
      pendingPattern = null;
      phase = 'idle';
      phaseTimer = 1.5;
      totalTime = 0;

      fightButton = null;
      fightSpawnTimer = 2.5;
      damageTexts = [];

      keys = {};
      updateHud();
      warningTextSpan.textContent = 'SAFE';
    }

    function startGame() {
      resetState();
      running = true;
      lastTimestamp = 0;
    }

    function restartGame() {
      resetState();
      running = true;
      lastTimestamp = 0;
    }

    function nextFightSpawnDelay() {
      const baseDelay = FIGHT_SPAWN_MIN + Math.random() * (FIGHT_SPAWN_MAX - FIGHT_SPAWN_MIN);
      const hpRatio = Math.max(0, Math.min(1, player.hp / player.maxHp));
      const mult = FIGHT_SPAWN_LOWHP_MULT + (1 - FIGHT_SPAWN_LOWHP_MULT) * hpRatio;
      return baseDelay * mult;
    }

    // ============ ATTACK PATTERNS ============

    function spawnSwarm(fromLeft, bandY, bandHeight) {
      const startX = fromLeft ? -20 : W + 20;
      const vx = fromLeft ? 9 : -9;
      const count = 45;
      for (let i = 0; i < count; i++) {
        const size = 6 + Math.random() * 6;
        const y = bandY + Math.random() * bandHeight;
        const x = startX + (fromLeft ? -1 : 1) * (Math.random() * 400);
        const vy = (Math.random() - 0.5) * 1.2;
        bullets.push({ x, y, size, vx, vy });
      }
    }

    function spawnRain() {
      const count = 22;
      for (let i = 0; i < count; i++) {
        const size = 7 + Math.random() * 6;
        const baseX = player.x + (Math.random() - 0.5) * 240;
        const x = Math.max(size / 2, Math.min(W - size / 2, baseX));
        const y = -20 - Math.random() * 120;
        const vy = 6 + Math.random() * 3;
        bullets.push({ x, y, size, vx: 0, vy });
      }
    }

    function spawnWall(fromLeft, gapY, gapSize) {
      const startX = fromLeft ? -20 : W + 20;
      const vx = fromLeft ? 7 : -7;
      const size = 10;
      const step = size + 1;
      const count = Math.ceil(H / step) + 2;
      for (let i = 0; i < count; i++) {
        const y = i * step - step;
        if (y + size > gapY && y < gapY + gapSize) continue;
        bullets.push({ x: startX, y, size, vx, vy: 0 });
      }
    }

    function spawnSpiral() {
      const cx = player.x;
      const cy = player.y;
      const count = 24;
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2;
        const r = 220 + Math.random() * 40;
        const size = 7;
        const x = cx + Math.cos(ang) * r;
        const y = cy + Math.sin(ang) * r;
        const speed = 4.5;
        bullets.push({
          x, y, size,
          vx: -Math.cos(ang) * speed,
          vy: -Math.sin(ang) * speed
        });
      }
    }

    function spawnCross() {
      const cx = player.x, cy = player.y;
      const starts = [
        { x: -20, y: cy },
        { x: W + 20, y: cy },
        { x: cx, y: -20 },
        { x: cx, y: H + 20 }
      ];
      for (const sp of starts) {
        for (let i = 0; i < 6; i++) {
          const size = 8;
          const jitter = (Math.random() - 0.5) * 60;
          const dx = (cx + jitter) - sp.x;
          const dy = (cy + jitter) - sp.y;
          const len = Math.hypot(dx, dy) || 1;
          const speed = 5;
          bullets.push({
            x: sp.x, y: sp.y, size,
            vx: (dx / len) * speed,
            vy: (dy / len) * speed
          });
        }
      }
    }

    const patterns = [
      { name: 'swarm',  weight: 3, spawn: (c) => spawnSwarm(c.fromLeft, c.bandY, c.bandHeight) },
      { name: 'rain',   weight: 2, spawn: () => spawnRain() },
      { name: 'wall',   weight: 3, spawn: (c) => spawnWall(c.fromLeft, c.gapY, c.gapSize) },
      { name: 'spiral', weight: 2, spawn: () => spawnSpiral() },
      { name: 'cross',  weight: 2, spawn: () => spawnCross() }
    ];

    function pickPattern() {
      const total = patterns.reduce((s, p) => s + p.weight, 0);
      let r = Math.random() * total;
      for (const p of patterns) {
        r -= p.weight;
        if (r <= 0) return p;
      }
      return patterns[0];
    }

    function getCooldown() {
      const base = 1.5;
      const minCd = 0.7;
      let cd = Math.max(minCd, base - totalTime * 0.006);
      if (options.attackPerHp) {
        const hpRatio = Math.max(0, Math.min(1, player.hp / player.maxHp));
        const mult = APHP_COOLDOWN_MIN_MULT + (1 - APHP_COOLDOWN_MIN_MULT) * hpRatio;
        cd *= mult;
      }
      return cd;
    }

    function startPattern() {
      const p = pickPattern();
      pendingPattern = p;

      if (p.name === 'swarm') {
        const fromLeft = Math.random() < 0.5;
        const bandHeight = 80 + Math.random() * 100;
        let bandY;
        if (Math.random() < 0.6) {
          bandY = player.y - bandHeight / 2 + (Math.random() - 0.5) * 60;
        } else {
          bandY = Math.random() * (H - bandHeight);
        }
        bandY = Math.max(0, Math.min(H - bandHeight, bandY));
        warning = { type: 'swarm', fromLeft, bandY, bandHeight, timer: 0.9, duration: 0.9 };
        pendingPattern.ctx = { fromLeft, bandY, bandHeight };
        phase = 'warning';
        phaseTimer = 0.9;
      } else if (p.name === 'wall') {
        const fromLeft = Math.random() < 0.5;
        const gapSize = 110;
        const gapY = Math.random() * (H - gapSize);
        warning = { type: 'wall', fromLeft, gapY, gapSize, timer: 0.8, duration: 0.8 };
        pendingPattern.ctx = { fromLeft, gapY, gapSize };
        phase = 'warning';
        phaseTimer = 0.8;
      } else {
        p.spawn({});
        pendingPattern = null;
        phase = 'idle';
        phaseTimer = getCooldown();
      }
    }

    // ============ FIGHT BUTTON ============

    function spawnFightButton() {
      const pad = 20;
      let bx, by, tries = 0;
      do {
        bx = pad + Math.random() * (W - FIGHT_W - pad * 2);
        by = pad + Math.random() * (H - FIGHT_H - pad * 2);
        tries++;
      } while (tries < 30 && (
        (bx + FIGHT_W > boss.x - 10 && bx < boss.x + boss.size + 10 &&
         by + FIGHT_H > boss.y - 10 && by < boss.y + boss.size + 10)
        ||
        (Math.hypot((bx + FIGHT_W/2) - player.x, (by + FIGHT_H/2) - player.y) < 80)
      ));

      fightButton = { x: bx, y: by, w: FIGHT_W, h: FIGHT_H, life: FIGHT_LIFETIME };
    }

    function collectFightButton() {
      boss.hp -= FIGHT_DAMAGE;
      if (boss.hp < 0) boss.hp = 0;

      boss.hitFlash = HIT_FLASH_TIME;
      boss.slashTimer = SLASH_TIME;
      boss.slashAngle = (boss.slashAngle + 1) % 2;
      boss.shakeTimer = SHAKE_TIME;

      damageTexts.push({
        x: boss.x + boss.size / 2,
        y: boss.y + boss.size + 12,
        text: `DEALT ${FIGHT_DAMAGE} DMG`,
        life: 1.0,
        maxLife: 1.0
      });

      updateHud();
      fightButton = null;

      if (boss.hp <= 0) {
        won = true;
        gameOver = true;
        running = false;
      }
    }

    // ============ UPDATE ============

    function update(dt) {
      if (gameOver) return;
      totalTime += dt;

      let mx = 0, my = 0;
      if (keys['w'] || keys['arrowup']) my -= 1;
      if (keys['s'] || keys['arrowdown']) my += 1;
      if (keys['a'] || keys['arrowleft']) mx -= 1;
      if (keys['d'] || keys['arrowright']) mx += 1;
      if (mx || my) {
        const len = Math.hypot(mx, my);
        player.x += (mx / len) * player.speed * dt * 60;
        player.y += (my / len) * player.speed * dt * 60;
        player.x = Math.max(player.size / 2, Math.min(W - player.size / 2, player.x));
        player.y = Math.max(player.size / 2, Math.min(H - player.size / 2, player.y));
      }

      if (player.invincible) {
        player.invincibleTimer -= dt;
        player.blinkAccum += dt;
        if (player.blinkAccum >= 0.07) {
          player.blinkAccum -= 0.07;
          player.visible = !player.visible;
        }
        if (player.invincibleTimer <= 0) {
          player.invincible = false;
          player.visible = true;
        }
      }

      if (boss.hitFlash > 0) boss.hitFlash -= dt;
      if (boss.slashTimer > 0) boss.slashTimer -= dt;
      if (boss.shakeTimer > 0) {
        boss.shakeTimer -= dt;
        const t = boss.shakeTimer / SHAKE_TIME;
        const amp = SHAKE_AMP * t;
        boss.shakeOffset.x = (Math.random() - 0.5) * 2 * amp;
        boss.shakeOffset.y = (Math.random() - 0.5) * 2 * amp;
      } else {
        boss.shakeOffset.x = 0;
        boss.shakeOffset.y = 0;
      }

      phaseTimer -= dt;
      if (phaseTimer <= 0) {
        if (phase === 'idle') {
          startPattern();
        } else if (phase === 'warning') {
          if (pendingPattern) {
            pendingPattern.spawn(pendingPattern.ctx || {});
            pendingPattern = null;
          }
          warning = null;
          phase = 'idle';
          phaseTimer = getCooldown();
        }
      }

      if (phase === 'warning' && warning) {
        if (warning.type === 'swarm') {
          warningTextSpan.textContent = warning.fromLeft ? '← SWARM!' : 'SWARM! →';
        } else if (warning.type === 'wall') {
          warningTextSpan.textContent = warning.fromLeft ? '← WALL!' : 'WALL! →';
        }
      } else {
        warningTextSpan.textContent = 'SAFE';
      }

      if (!fightButton && !won) {
        fightSpawnTimer -= dt;
        if (fightSpawnTimer <= 0) {
          spawnFightButton();
          fightSpawnTimer = nextFightSpawnDelay();
        }
      }

      if (fightButton) {
        fightButton.life -= dt;
        if (fightButton.life <= 0) {
          fightButton = null;
        } else {
          const pHalf = player.size / 2;
          if (player.x + pHalf > fightButton.x &&
              player.x - pHalf < fightButton.x + fightButton.w &&
              player.y + pHalf > fightButton.y &&
              player.y - pHalf < fightButton.y + fightButton.h) {
            collectFightButton();
          }
        }
      }

      for (let i = damageTexts.length - 1; i >= 0; i--) {
        const t = damageTexts[i];
        t.life -= dt;
        t.y -= dt * 20;
        if (t.life <= 0) damageTexts.splice(i, 1);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt * 60;
        b.y += b.vy * dt * 60;

        if (b.x < -200 || b.x > W + 200 || b.y < -200 || b.y > H + 200) {
          bullets.splice(i, 1);
          continue;
        }

        if (!player.invincible) {
          const h = b.size / 2;
          const hitR = player.size / 2 * 0.6;
          if (b.x + h > player.x - hitR && b.x - h < player.x + hitR &&
              b.y + h > player.y - hitR && b.y - h < player.y + hitR) {
            player.hp -= DAMAGE;
            player.invincible = true;
            player.invincibleTimer = INVINCIBLE_TIME;
            player.blinkAccum = 0;
            updateHud();
            bullets.splice(i, 1);
            if (player.hp <= 0) {
              player.hp = 0;
              gameOver = true;
              running = false;
              updateHud();
            }
          }
        }
      }
    }

    // ============ DRAW ============

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      if (warning) {
        if (warning.type === 'swarm') {
          ctx.fillStyle = 'rgba(255,255,255,0.07)';
          ctx.fillRect(0, warning.bandY, W, warning.bandHeight);
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.setLineDash([6, 6]);
          ctx.strokeRect(0, warning.bandY, W, warning.bandHeight);
          ctx.setLineDash([]);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 26px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const arrowY = warning.bandY + warning.bandHeight / 2;
          if (warning.fromLeft) {
            ctx.fillText('→', 26, arrowY);
          } else {
            ctx.fillText('←', W - 26, arrowY);
          }
          ctx.textBaseline = 'alphabetic';
        } else if (warning.type === 'wall') {
          const x = warning.fromLeft ? 14 : W - 14;
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, warning.gapY);
          ctx.moveTo(x, warning.gapY + warning.gapSize);
          ctx.lineTo(x, H);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 26px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const arrowY = warning.gapY + warning.gapSize / 2;
          if (warning.fromLeft) {
            ctx.fillText('→', 30, arrowY);
          } else {
            ctx.fillText('←', W - 30, arrowY);
          }
          ctx.textBaseline = 'alphabetic';
        }
      }

      ctx.fillStyle = '#fff';
      for (const b of bullets) {
        ctx.fillRect(b.x - b.size / 2, b.y - b.size / 2, b.size, b.size);
      }

      const bossDrawX = boss.x + boss.shakeOffset.x;
      const bossDrawY = boss.y + boss.shakeOffset.y;
      const bossColor = boss.hitFlash > 0 ? '#afffaf' : '#22c55e';
      ctx.fillStyle = bossColor;
      ctx.fillRect(bossDrawX, bossDrawY, boss.size, boss.size);
      ctx.strokeStyle = '#064e3b';
      ctx.lineWidth = 3;
      ctx.strokeRect(bossDrawX, bossDrawY, boss.size, boss.size);

      if (boss.slashTimer > 0) {
        const alpha = Math.min(1, boss.slashTimer / SLASH_TIME);
        ctx.strokeStyle = `rgba(255, 0, 0, ${alpha})`;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (boss.slashAngle === 0) {
          ctx.moveTo(bossDrawX + 6, bossDrawY + 6);
          ctx.lineTo(bossDrawX + boss.size - 6, bossDrawY + boss.size - 6);
        } else {
          ctx.moveTo(bossDrawX + boss.size - 6, bossDrawY + 6);
          ctx.lineTo(bossDrawX + 6, bossDrawY + boss.size - 6);
        }
        ctx.stroke();
        ctx.lineCap = 'butt';
      }

      const barW = boss.size + 20;
      const barH = 6;
      const barX = boss.x - 10;
      const barY = boss.y - 14;
      ctx.fillStyle = '#222';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(barX, barY, barW * (boss.hp / boss.maxHp), barH);

      if (fightButton) {
        const blink = fightButton.life < 1.0 && Math.floor(fightButton.life * 10) % 2 === 0;
        ctx.fillStyle = blink ? '#cccccc' : '#ffff00';
        ctx.fillRect(fightButton.x, fightButton.y, fightButton.w, fightButton.h);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(fightButton.x, fightButton.y, fightButton.w, fightButton.h);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('FIGHT', fightButton.x + fightButton.w / 2, fightButton.y + fightButton.h / 2);
        ctx.textBaseline = 'alphabetic';
      }

      if (!player.invincible || player.visible) {
        ctx.fillStyle = '#f00';
        ctx.fillRect(
          player.x - player.size / 2,
          player.y - player.size / 2,
          player.size,
          player.size
        );
      }

      for (const t of damageTexts) {
        const alpha = t.life / t.maxLife;
        ctx.fillStyle = `rgba(255, 60, 60, ${alpha})`;
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x, t.y);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, W, H);

        if (won) {
          ctx.fillStyle = '#22c55e';
          ctx.font = 'bold 52px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('YOU WIN!', W / 2, H / 2 - 30);
          ctx.fillStyle = '#fff';
          ctx.font = '20px monospace';
          ctx.fillText('The green square has been defeated.', W / 2, H / 2 + 20);
          ctx.font = 'bold 18px monospace';
          ctx.fillText('press R or RESTART to play again', W / 2, H / 2 + 70);
        } else {
          ctx.fillStyle = '#f00';
          ctx.font = 'bold 48px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
          ctx.fillStyle = '#fff';
          ctx.font = '18px monospace';
          ctx.fillText('press R or RESTART', W / 2, H / 2 + 40);
        }
      }
    }

    // ============ LOOP ============

    function loop(now) {
      if (!lastTimestamp) lastTimestamp = now;
      let dt = (now - lastTimestamp) / 1000;
      if (dt > 0.1) dt = 0.1;
      lastTimestamp = now;

      if (running && !gameOver) update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // ============ INPUT ============

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
        e.preventDefault();
        keys[k] = true;
      }
      if (k === 'r' && running) restartGame();
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
        e.preventDefault();
        keys[k] = false;
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (running) restartGame();
    });

    // ============ BOOT ============
    updateHud();
    draw();
    syncMenuFromOptions();
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
